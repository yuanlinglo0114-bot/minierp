{% extends "base.html" %}
{% block title %}{{ '編輯出庫單' if header else '新增出庫單' }} - {{ brand_name }}{% endblock %}
{% block page_title %}{{ '編輯出庫單' if header else '新增出庫單' }}{% endblock %}
{% block content %}
<form class="form-panel" method="post" style="max-width:820px;">
  {% if header %}
  <div class="field">
    <label>出庫單號</label>
    <input type="text" value="{{ header.OutboundId }}" disabled>
  </div>
  {% endif %}
  <div class="field">
    <label>出庫日期</label>
    <input type="date" name="outbound_date" required value="{{ form_date }}">
  </div>
  <div class="field">
    <label>經手員工</label>
    <select name="employee_id" required>
      <option value="">請選擇</option>
      {% for e in employees %}
      <option value="{{ e.EmployeeId }}" {{ 'selected' if e.EmployeeId == form_employee_id else '' }}>{{ e.EmployeeId }} - {{ e.EmployeeName }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>客戶</label>
    <select name="customer_id" required>
      <option value="">請選擇</option>
      {% for c in customers %}
      <option value="{{ c.CustomerId }}" {{ 'selected' if c.CustomerId == form_customer_id else '' }}>{{ c.CustomerId }} - {{ c.CustomerName }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>單別</label>
    <select name="doc_type_id" required>
      <option value="">請選擇</option>
      {% for dt in doctypes %}
      <option value="{{ dt.DocTypeId }}" {{ 'selected' if dt.DocTypeId == form_doc_type_id else '' }}>{{ dt.DocTypeId }} - {{ dt.DocTypeName }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>倉別</label>
    <select name="warehouse_id" required>
      <option value="">請選擇</option>
      {% for w in warehouses %}
      <option value="{{ w.WarehouseId }}" {{ 'selected' if w.WarehouseId == form_warehouse_id else '' }}>{{ w.WarehouseId }} - {{ w.WarehouseName }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="detail-section">
    <h2>明細行</h2>
    <div id="line-rows" class="line-rows">
      {% for line in lines %}
      <div class="line-row">
        <select name="product_id">
          {% for p in products %}
          <option value="{{ p.ProductId }}" {{ 'selected' if p.ProductId == line.ProductId else '' }}>{{ p.ProductId }} - {{ p.ProductName }}</option>
          {% endfor %}
        </select>
        <input type="number" step="0.001" min="0.001" name="quantity" required value="{{ line.Quantity }}">
        <span class="remove-line" onclick="this.parentElement.remove()">移除</span>
      </div>
      {% endfor %}
    </div>
    <button type="button" class="btn btn-secondary btn-sm" onclick="addLine()">+ 新增一行</button>
  </div>

  <template id="line-template">
    <div class="line-row">
      <select name="product_id">
        {% for p in products %}
        <option value="{{ p.ProductId }}">{{ p.ProductId }} - {{ p.ProductName }}</option>
        {% endfor %}
      </select>
      <input type="number" step="0.001" min="0.001" name="quantity" required value="1">
      <span class="remove-line" onclick="this.parentElement.remove()">移除</span>
    </div>
  </template>

  <div style="margin-top:20px;">
    <button class="btn" type="submit">儲存</button>
    <a class="btn btn-secondary" href="{{ url_for('outbound.list_view') }}">取消</a>
  </div>
</form>

<script>
function addLine() {
  const tpl = document.getElementById('line-template');
  const clone = tpl.content.cloneNode(true);
  document.getElementById('line-rows').appendChild(clone);
}
if (document.getElementById('line-rows').children.length === 0) {
  addLine();
}
</script>
{% endblock %}
