{% extends "base.html" %}
{% block title %}{{ '編輯物料' if product else '新增物料' }} - MiniERP{% endblock %}
{% block page_title %}{{ '編輯物料' if product else '新增物料' }}{% endblock %}
{% block content %}
<form class="form-panel" method="post">
  {% if product %}
  <div class="field">
    <label>物料代號</label>
    <input type="text" value="{{ product.ProductId }}" disabled>
  </div>
  {% endif %}
  <div class="field">
    <label>物料名稱</label>
    <input type="text" name="product_name" required
      value="{{ form.product_name if form else (product.ProductName if product else '') }}">
  </div>
  <div class="field">
    <label>庫存量</label>
    <input type="number" step="0.001" name="stock_balance" required
      value="{{ form.stock_balance if form else (product.StockBalance if product else 0) }}">
  </div>
  <button class="btn" type="submit">儲存</button>
  <a class="btn btn-secondary" href="{{ url_for('product.list_view') }}">取消</a>
</form>
{% endblock %}
