<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 - {{ brand_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(165deg, var(--candy-gold) 0%, var(--candy-pink) 100%);">
    <form class="form-panel" method="post" style="width:320px; text-align:center;">
      <div style="display:flex; justify-content:center; margin-bottom:14px;">
        <span class="candy-icon" style="margin:0;"></span>
      </div>
      <h1 style="font-size:20px; margin:0 0 18px; color:var(--candy-gold-dark);">{{ brand_name }}</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="field" style="text-align:left;">
        <label>密碼</label>
        <input type="password" name="password" required autofocus>
      </div>
      <button class="btn" type="submit" style="width:100%;">登入</button>
    </form>
  </div>
</body>
</html>
